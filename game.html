<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ласка vs Паук</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a1a2e;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Segoe UI',sans-serif;overflow:hidden}
.game-wrapper{background:#16213e;border-radius:20px;padding:30px;box-shadow:0 0 40px rgba(0,0,0,0.5)}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;color:#fff}
.header h1{font-size:24px;display:flex;align-items:center;gap:8px}
.score-box{background:#0f3460;padding:8px 20px;border-radius:10px;font-size:18px;color:#e94560;font-weight:bold}
canvas{display:block;margin:0 auto;border-radius:10px;box-shadow:0 0 20px rgba(233,69,96,0.3);background:#0f3460;cursor:pointer}
.controls{display:flex;justify-content:center;gap:12px;margin-top:15px}
.controls button{background:#e94560;color:#fff;border:none;padding:10px 25px;border-radius:8px;font-size:16px;cursor:pointer;transition:0.2s;font-weight:bold}
.controls button:hover{background:#c73650;transform:scale(1.05)}
.controls button:active{transform:scale(0.95)}
.hint{color:#888;text-align:center;margin-top:10px;font-size:13px}
</style>
</head>
<body>
<div class="game-wrapper">
<div class="header">
<h1>🦊 Ласка vs 🕷️ Паук</h1>
<div class="score-box">🐜 <span id="score">0</span></div>
</div>
<canvas id="game" width="400" height="400"></canvas>
<div class="controls">
<button id="restartBtn">🔄 Заново</button>
</div>
<div class="hint">Нажми Enter / Пробел для паузы | Стрелки — управление</div>
</div>
<script>
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('score');

const SIZE=20;
const COLS=canvas.width/SIZE;
const ROWS=canvas.height/SIZE;

let snake=[{x:5,y:5}];
let dir={x:1,y:0};
let nextDir={x:1,y:0};
let spider={x:10,y:10};
let score=0;
let paused=false;
let gameOver=false;
let speed=150;
let gameLoop;

function randomPos(){
return{x:Math.floor(Math.random()*COLS),y:Math.floor(Math.random()*ROWS)};
}

function spawnSpider(){
let pos;
do{pos=randomPos();}while(snake.some(s=>s.x===pos.x&&s.y===pos.y));
spider=pos;
}

function init(){
snake=[{x:5,y:5}];
dir={x:1,y:0};
nextDir={x:1,y:0};
score=0;
gameOver=false;
paused=false;
speed=150;
scoreEl.textContent='0';
spawnSpider();
clearInterval(gameLoop);
gameLoop=setInterval(tick,speed);
}

function tick(){
if(paused||gameOver)return;
move();
draw();
}

function move(){
const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};

if(head.x<0||head.x>=COLS||head.y<0||head.y>=ROWS){
gameOver=true;
draw();
clearInterval(gameLoop);
return;
}

for(let s of snake){
if(head.x===s.x&&head.y===s.y){
gameOver=true;
draw();
clearInterval(gameLoop);
return;
}
}

snake.unshift(head);

if(head.x===spider.x&&head.y===spider.y){
score+=10;
scoreEl.textContent=score;
if(score%50===0&&speed>60){
speed=Math.max(60,speed-10);
clearInterval(gameLoop);
gameLoop=setInterval(tick,speed);
}
spawnSpider();
}else{
snake.pop();
}
}

function draw(){
ctx.clearRect(0,0,canvas.width,canvas.height);

// grid
ctx.strokeStyle='rgba(255,255,255,0.05)';
ctx.lineWidth=1;
for(let i=0;i<=COLS;i++){
ctx.beginPath();ctx.moveTo(i*SIZE,0);ctx.lineTo(i*SIZE,canvas.height);ctx.stroke();
}
for(let i=0;i<=ROWS;i++){
ctx.beginPath();ctx.moveTo(0,i*SIZE);ctx.lineTo(canvas.width,i*SIZE);ctx.stroke();
}

// spider
const sx=spider.x*SIZE+SIZE/2,sy=spider.y*SIZE+SIZE/2;
ctx.fillStyle='#222';
ctx.beginPath();ctx.arc(sx+2,sy-1,5,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.arc(sx-2,sy-1,5,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.arc(sx,sy+1,6,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#e94560';
ctx.beginPath();ctx.arc(sx,sy+1,4,0,Math.PI*2);ctx.fill();
ctx.strokeStyle='#222';ctx.lineWidth=1.5;
for(let i=0;i<8;i++){
const a=i*Math.PI/4;
ctx.beginPath();ctx.moveTo(sx,sy);ctx.lineTo(sx+Math.cos(a)*12,sy+Math.sin(a)*12);ctx.stroke();
}
ctx.fillStyle='#fff';
ctx.beginPath();ctx.arc(sx-2,sy-1,1.5,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.arc(sx+2,sy-1,1.5,0,Math.PI*2);ctx.fill();

// weasel
snake.forEach((s,i)=>{
const x=s.x*SIZE,y=s.y*SIZE;
const isHead=i===0;
const t=isHead?0:Math.min(i*0.06,1);

const r=Math.round(180+t*30);
const g=Math.round(140+t*20);
const b=Math.round(100-t*20);
ctx.fillStyle=`rgb(${r},${g},${b})`;
ctx.shadowColor='rgba(233,69,96,0.3)';
ctx.shadowBlur=isHead?10:4;

const pad=isHead?1:2;
const radius=SIZE/2-pad;
ctx.beginPath();
ctx.ellipse(x+SIZE/2,y+SIZE/2,radius*1.1,radius,0,0,Math.PI*2);
ctx.fill();
ctx.shadowBlur=0;

if(isHead){
// eyes
ctx.fillStyle='#fff';
ctx.beginPath();ctx.arc(x+13,y+6,3.5,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.arc(x+7,y+6,3.5,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#111';
ctx.beginPath();ctx.arc(x+14,y+6,2,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.arc(x+8,y+6,2,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#fff';
ctx.beginPath();ctx.arc(x+14.5,y+5.5,0.8,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.arc(x+8.5,y+5.5,0.8,0,Math.PI*2);ctx.fill();
// nose
ctx.fillStyle='#222';
ctx.beginPath();ctx.arc(x+10,y+10,2,0,Math.PI*2);ctx.fill();
// ears
ctx.fillStyle=`rgb(${r},${g-20},${b})`;
ctx.beginPath();ctx.ellipse(x+5,y+2,3,4,0,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.ellipse(x+15,y+2,3,4,0,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#e8b4b4';
ctx.beginPath();ctx.ellipse(x+5,y+2,1.5,2.5,0,0,Math.PI*2);ctx.fill();
ctx.beginPath();ctx.ellipse(x+15,y+2,1.5,2.5,0,0,Math.PI*2);ctx.fill();
}
});

// game over
if(gameOver){
ctx.fillStyle='rgba(0,0,0,0.6)';
ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.fillStyle='#fff';
ctx.font='bold 32px Segoe UI,sans-serif';
ctx.textAlign='center';
ctx.fillText('💀 Game Over',canvas.width/2,canvas.height/2-10);
ctx.font='18px Segoe UI,sans-serif';
ctx.fillStyle='#e94560';
ctx.fillText(`Счёт: ${score}`,canvas.width/2,canvas.height/2+35);
}

// pause
if(paused&&!gameOver){
ctx.fillStyle='rgba(0,0,0,0.4)';
ctx.fillRect(0,0,canvas.width,canvas.height);
ctx.fillStyle='#fff';
ctx.font='bold 28px Segoe UI,sans-serif';
ctx.textAlign='center';
ctx.fillText('⏸ Пауза',canvas.width/2,canvas.height/2);
}
}

document.addEventListener('keydown',e=>{
if(gameOver)return;
if(e.key===' '||e.key==='Enter'){
e.preventDefault();
paused=!paused;
if(!paused)draw();
return;
}
if(paused)return;
switch(e.key){
case 'ArrowUp':if(dir.y!==1)nextDir={x:0,y:-1};break;
case 'ArrowDown':if(dir.y!==-1)nextDir={x:0,y:1};break;
case 'ArrowLeft':if(dir.x!==1)nextDir={x:-1,y:0};break;
case 'ArrowRight':if(dir.x!==-1)nextDir={x:1,y:0};break;
}
});

document.getElementById('restartBtn').addEventListener('click',()=>{
clearInterval(gameLoop);
init();
});

// swipe support
let touchStart=null;
canvas.addEventListener('touchstart',e=>{
touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};
e.preventDefault();
},{passive:false});
canvas.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
canvas.addEventListener('touchend',e=>{
if(!touchStart||paused||gameOver)return;
const dx=e.changedTouches[0].clientX-touchStart.x;
const dy=e.changedTouches[0].clientY-touchStart.y;
if(Math.abs(dx)>Math.abs(dy)){
if(dx>0&&dir.x!==-1)nextDir={x:1,y:0};
else if(dx<0&&dir.x!==1)nextDir={x:-1,y:0};
}else{
if(dy>0&&dir.y!==-1)nextDir={x:0,y:1};
else if(dy<0&&dir.y!==1)nextDir={x:0,y:-1};
}
touchStart=null;
});

// always update dir from nextDir before tick
const origTick=tick;
tick=function(){
dir={...nextDir};
origTick.call(this);
};

init();
</script>
</body>
</html>
