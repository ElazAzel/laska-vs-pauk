<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Ласка vs Паук — 3D</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦊</text></svg>">
<style>
:root {
  --bg: #070b14;
  --surface: rgba(18,23,34,0.85);
  --surface-2: rgba(12,17,28,0.88);
  --panel: rgba(255,255,255,0.05);
  --panel-hover: rgba(255,255,255,0.09);
  --fg: #f0f4ff;
  --fg-2: #a0b4d0;
  --muted: #6078a0;
  --accent: #e94560;
  --accent-glow: rgba(233,69,96,0.3);
  --gold: #ffd700;
  --green: #44e888;
  --border: rgba(255,255,255,0.07);
  --border-soft: rgba(255,255,255,0.035);
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --font: 'Segoe UI','SF Pro Display',system-ui,sans-serif;
  --font-mono: 'SF Mono','Cascadia Code',ui-monospace,monospace;
  --ease: cubic-bezier(0.2,0,0,1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);font-family:var(--font);touch-action:none;user-select:none;-webkit-font-smoothing:antialiased}
canvas{display:block}

#hud{position:fixed;top:0;left:0;right:0;z-index:10;pointer-events:none;
  padding:12px 16px;display:flex;justify-content:space-between;align-items:flex-start;
  background:linear-gradient(180deg,rgba(7,11,20,0.65) 0%,transparent 100%)}
#hud>*{pointer-events:auto}
.hud-group{display:flex;align-items:center;gap:6px}
.hud-btn{background:var(--surface);border:1px solid var(--border);color:var(--fg);
  padding:6px 14px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;
  cursor:pointer;transition:all 0.2s var(--ease);backdrop-filter:blur(12px);
  display:flex;align-items:center;gap:5px;letter-spacing:0.01em}
.hud-btn:hover{background:rgba(233,69,96,0.18);border-color:var(--accent);transform:translateY(-1px)}
.hud-btn:active{transform:translateY(0)}
.hud-badge{background:var(--surface);backdrop-filter:blur(12px);border:1px solid var(--border);
  border-radius:var(--radius-sm);padding:6px 12px;font-size:13px;font-weight:600;
  display:flex;align-items:center;gap:5px;color:var(--fg);letter-spacing:0.01em}
.hud-badge .coin{color:var(--gold)}
.hud-badge .score{color:var(--accent)}
#streakBadge.streak-hidden{opacity:0;transform:scale(0.8);pointer-events:none}
#streakBadge{transition:all 0.3s var(--ease)}
#speedBar{position:fixed;top:56px;left:50%;transform:translateX(-50%);z-index:10;pointer-events:none;width:min(160px,30vw);height:3px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden}
#speedFill{height:100%;width:0%;background:linear-gradient(90deg,var(--green),var(--gold),var(--accent));border-radius:3px;transition:width 0.5s var(--ease)}
#flash{position:fixed;inset:0;z-index:9;pointer-events:none;opacity:0;transition:opacity 0.15s ease-out}
#flash.flash{background:#fff;opacity:0.25}
#flash.death{background:#e00;opacity:0}
#flash.death.show{opacity:0.12}
@keyframes coinPop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
.coin-pop{animation:coinPop 0.35s var(--ease)}

#bonusBar{position:fixed;top:58px;left:50%;transform:translateX(-50%);z-index:10;pointer-events:none;display:flex;gap:4px}
.bonus-chip{background:var(--surface);backdrop-filter:blur(12px);border:1px solid var(--border);
  border-radius:999px;padding:3px 12px;color:var(--fg);font-size:11px;
  font-weight:600;display:flex;align-items:center;gap:4px;opacity:0;
  transition:opacity 0.3s var(--ease),transform 0.3s var(--ease);transform:translateY(-4px)}
.bonus-chip.show{opacity:1;transform:translateY(0)}
.bonus-chip .timer{color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}

#status{position:fixed;top:30%;left:50%;transform:translate(-50%,-50%);z-index:15;
  pointer-events:none;color:#fff;font-size:26px;font-weight:800;text-align:center;
  text-shadow:0 4px 40px rgba(0,0,0,0.8),0 0 50px var(--accent-glow);
  opacity:0;transition:opacity 0.4s cubic-bezier(0.34,1.56,0.64,1),transform 0.4s cubic-bezier(0.34,1.56,0.64,1);
  transform:translate(-50%,-30%) scale(0.8)}
#status.show{opacity:1;transform:translate(-50%,-50%) scale(1)}

#combo{position:fixed;top:38%;left:50%;transform:translate(-50%,-50%);z-index:12;
  pointer-events:none;font-size:52px;font-weight:900;color:#fff;text-align:center;
  text-shadow:0 0 35px var(--accent-glow),0 0 70px var(--accent-glow);
  opacity:0;transition:all 0.3s cubic-bezier(0.34,1.56,0.64,1);
  transform:translate(-50%,-50%) scale(0.6)}
#combo.pop{opacity:1;transform:translate(-50%,-55%) scale(1.12)}
#combo small{display:block;font-size:18px;font-weight:600;color:var(--gold);text-shadow:0 0 25px rgba(255,215,0,0.35);margin-top:2px}

#overlay{position:fixed;inset:0;z-index:30;pointer-events:none;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.5s var(--ease)}
#overlay.show{pointer-events:auto;opacity:1}
#overlay .bg{position:absolute;inset:0;background:rgba(7,11,20,0.65);backdrop-filter:blur(24px)}
#overlay .card{position:relative;text-align:center;color:#fff;padding:44px 48px;max-width:460px;width:90%;background:var(--surface-2);backdrop-filter:blur(16px);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:0 40px 120px rgba(0,0,0,0.6)}
#overlay .card h2{font-size:36px;font-weight:800;margin-bottom:4px;letter-spacing:-0.02em}
#overlay .card p{color:var(--fg-2);font-size:15px;margin-bottom:2px;line-height:1.5}
#overlay .card .final-score{font-size:24px;font-weight:700;color:var(--accent);margin:10px 0}
#overlay .card .hint{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.6}
#overlay .btn-start{display:inline-block;margin-top:16px;padding:13px 44px;background:var(--accent);color:#fff;border:none;border-radius:var(--radius-sm);font-size:17px;font-weight:700;cursor:pointer;transition:all 0.2s var(--ease);box-shadow:0 8px 35px var(--accent-glow);pointer-events:auto}
#overlay .btn-start:hover{transform:scale(1.05);box-shadow:0 12px 45px var(--accent-glow)}
#overlay .btn-start:active{transform:scale(0.97)}

#shop{position:fixed;inset:0;z-index:25;pointer-events:none;display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity 0.35s var(--ease)}
#shop.open{pointer-events:auto;opacity:1}
#shop .bg{position:absolute;inset:0;background:rgba(7,11,20,0.55);backdrop-filter:blur(16px)}
#shop .panel{position:relative;width:92%;max-width:560px;max-height:86vh;background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius-lg);display:flex;flex-direction:column;overflow:hidden;box-shadow:0 40px 120px rgba(0,0,0,0.6)}
#shop .head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;border-bottom:1px solid var(--border-soft)}
#shop .head h2{color:#fff;font-size:17px;font-weight:700;display:flex;align-items:center;gap:6px}
#shop .head .coins{color:var(--gold);font-size:14px;font-weight:700}
#shop .head .close{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;transition:all 0.2s var(--ease);padding:3px 5px;border-radius:5px}
#shop .head .close:hover{color:#fff;background:rgba(255,255,255,0.07)}
#shop .cats{display:flex;gap:3px;padding:8px 14px;overflow-x:auto;border-bottom:1px solid var(--border-soft);scrollbar-width:none}
#shop .cats::-webkit-scrollbar{display:none}
#shop .cats button{background:transparent;border:none;color:var(--muted);padding:6px 12px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;transition:all 0.2s var(--ease);white-space:nowrap}
#shop .cats button:hover{color:var(--fg);background:var(--panel)}
#shop .cats button.active{background:var(--accent);color:#fff}
#shop .items{flex:1;overflow-y:auto;padding:12px 14px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:7px}
#shop .item{background:var(--panel);border:1px solid var(--border-soft);border-radius:var(--radius-sm);padding:12px 10px;text-align:center;cursor:pointer;transition:all 0.2s var(--ease)}
#shop .item:hover{background:var(--panel-hover);transform:translateY(-2px);border-color:var(--border)}
#shop .item:active{transform:translateY(0)}
#shop .item.owned{border-color:rgba(68,232,136,0.25)}
#shop .item.equipped{border-color:var(--accent);background:rgba(233,69,96,0.08)}
#shop .item .icon{font-size:26px;margin-bottom:2px}
#shop .item .name{color:#fff;font-size:12px;font-weight:600;margin-bottom:1px}
#shop .item .desc{color:var(--muted);font-size:10px;margin-bottom:4px}
#shop .item .price{font-size:12px;font-weight:700;margin-bottom:3px}
#shop .item .price .coin{color:var(--gold)}
#shop .item .price .free{color:var(--green)}
#shop .item .price .locked{color:var(--muted)}
#shop .item .tag{font-size:9px;padding:2px 8px;border-radius:4px;display:inline-block;font-weight:700;text-transform:uppercase;letter-spacing:0.04em}
#shop .item .tag.owned{background:rgba(68,232,136,0.12);color:var(--green)}
#shop .item .tag.equipped{background:rgba(233,69,96,0.12);color:var(--accent)}
#shop .item .tag.buy{background:rgba(255,215,0,0.1);color:var(--gold)}
#shop .item .tag.locked{background:rgba(255,255,255,0.04);color:var(--muted)}
#shop .empty{color:var(--muted);text-align:center;padding:36px 16px;grid-column:1/-1;font-size:13px}

@media(max-width:600px){
  #hud{padding:8px 10px}
  .hud-btn,.hud-badge{font-size:11px;padding:5px 9px}
  .hud-label{display:none}
  #speedBar{width:min(100px,25vw);top:52px}
  #status{font-size:20px}
  #combo{font-size:34px}#combo small{font-size:14px}
  #overlay .card{padding:28px 22px}#overlay .card h2{font-size:26px}
  #shop .panel{width:96%;max-height:90vh}
  #shop .items{grid-template-columns:repeat(auto-fill,minmax(115px,1fr));padding:8px 8px 10px}
  #shop .item{padding:9px 7px}
}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.5) 100%)}
.float-score{position:fixed;z-index:20;font-size:30px;font-weight:900;pointer-events:none;color:var(--gold);text-shadow:0 0 40px rgba(255,215,0,0.6),0 4px 20px rgba(0,0,0,0.5);opacity:1;transform:translateY(0) scale(0.8);transition:all 1s cubic-bezier(0.15,0.85,0.3,1)}.float-score.up{opacity:0;transform:translateY(-100px) scale(1.3)}
</style>
</head>
<body>

<div id="hud">
  <div class="hud-group">
    <button class="hud-btn" id="shopBtn"><span>🏪</span><span class="hud-label">Магазин</span></button>
    <button class="hud-btn" id="restartBtn"><span title="Заново">🔄</span></button>
  </div>
  <div class="hud-group">
    <div id="streakBadge" class="hud-badge streak-hidden"><span>🔥</span><span id="streakDisplay">0</span></div>
    <div class="hud-badge"><span class="coin">🪙</span> <span id="coinsDisplay">0</span></div>
    <div class="hud-badge"><span class="score">🐜</span> <span id="scoreDisplay">0</span></div>
  </div>
</div>
<div id="speedBar"><div id="speedFill"></div></div>
<div id="bonusBar"></div>
<div id="status"></div>
<div id="combo">+10</div>
<div id="flash"></div>
<div id="vignette"></div>

<div id="overlay">
  <div class="bg"></div>
  <div class="card" id="overlayContent">
    <h2 id="overlayTitle">🦊 Ласка vs 🕷️</h2>
    <p id="overlaySub">Гоняй пауков, зарабатывай 🪙 и покупай крутые штуки!</p>
    <div class="final-score" id="overlayScore"></div>
    <p class="hint">⬆⬇⬅➡ / WASD · Пробел — пауза · B — магазин</p>
  </div>
</div>

<div id="shop">
  <div class="bg"></div>
  <div class="panel">
    <div class="head">
      <h2>🏪 Магазин</h2>
      <span class="coins">🪙 <span id="shopCoins">0</span></span>
      <button class="close" id="shopClose">✕</button>
    </div>
    <div class="cats" id="shopCats"></div>
    <div class="items" id="shopItems"></div>
  </div>
</div>

<script>
if(location.protocol==='file:'){
  document.write('<div style="display:flex;align-items:center;justify-content:center;height:100vh;background:#070b14;color:#fff;font-family:Segoe UI;text-align:center;padding:40px">'+
    '<div><h1 style="font-size:30px;margin-bottom:12px">🦊 Нужен локальный сервер</h1>'+
    '<p style="font-size:15px;color:#a0b4d0;margin-bottom:14px">Открой через HTTP:</p>'+
    '<pre style="background:#121722;padding:12px 18px;border-radius:10px;font-size:13px;color:#60c8fa;text-align:left;display:inline-block;border:1px solid rgba(255,255,255,0.05)">cd "'+location.pathname.replace(/[^/]*$/,'')+'"\npython -m http.server 8080</pre>'+
    '<p style="margin-top:12px;color:#6078a0;font-size:12px">Потом открой <b style="color:#e94560">http://localhost:8080/</b></p></div></div>');

</script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ─── Config ──────────────────────────────────────────
const COLS=20,ROWS=20;
const BASE_INTERVAL=180,MIN_INTERVAL=70;
const COINS_PER_SPIDER=10;
const STREAK_BONUS_EVERY=5;
const STREAK_BONUS_COINS=5;
const MILESTONE_EVERY=100;
const MILESTONE_BONUS=20;

// ─── Audio ───────────────────────────────────────────
const audioCtx=new (window.AudioContext||window.webkitAudioContext)();
function playTone(freq,dur,type='sine',vol=0.12){
  try{const osc=audioCtx.createOscillator();osc.type=type;osc.frequency.value=freq;
    const g=audioCtx.createGain();g.gain.setValueAtTime(vol,audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+dur);
    osc.connect(g);g.connect(audioCtx.destination);osc.start();osc.stop(audioCtx.currentTime+dur);}catch(e){}
}
function playSfx(name){
  switch(name){
    case 'eat':playTone(880,0.15);setTimeout(()=>playTone(1100,0.1),60);break;
    case 'die':playTone(220,0.4,'sawtooth',0.08);playTone(160,0.5,'sawtooth',0.06);break;
    case 'bonus':playTone(660,0.1);setTimeout(()=>playTone(880,0.12),80);setTimeout(()=>playTone(1100,0.15),160);break;
    case 'buy':playTone(550,0.08);setTimeout(()=>playTone(660,0.08),50);setTimeout(()=>playTone(770,0.1),100);break;
    case 'shield':playTone(440,0.12,'triangle',0.15);setTimeout(()=>playTone(660,0.12,'triangle',0.12),80);break;
    case 'click':playTone(440,0.04,'square',0.03);break;
  }
}

// ─── DOM ─────────────────────────────────────────────
const $=id=>document.getElementById(id);
const scoreEl=$('scoreDisplay'),coinsEl=$('coinsDisplay'),shopCoinsEl=$('shopCoins');
const overlay=$('overlay'),overlayTitle=$('overlayTitle'),overlaySub=$('overlaySub'),overlayScore=$('overlayScore');
const statusEl=$('status'),comboEl=$('combo'),shopEl=$('shop'),shopItemsEl=$('shopItems'),shopCatsEl=$('shopCats');
const shopBtn=$('shopBtn'),shopClose=$('shopClose'),bonusBar=$('bonusBar');
const streakEl=$('streakDisplay'),streakBadge=$('streakBadge'),speedFill=$('speedFill'),flashEl=$('flash');
function popCoin(){coinsEl.classList.remove('coin-pop');void coinsEl.offsetWidth;coinsEl.classList.add('coin-pop');}
function showFlash(){flashEl.classList.remove('flash','death','show');void flashEl.offsetWidth;flashEl.classList.add('flash');setTimeout(()=>flashEl.classList.remove('flash'),100);}
function showFloatingScore(text,color){
  const el=document.createElement('div');el.className='float-score';el.textContent=text;
  if(color)el.style.color=color;document.body.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('up'));
  setTimeout(()=>el.remove(),1200);
}
let webRemnants=[];
function spawnWebRemnant(pos){
  const wm=new THREE.LineBasicMaterial({color:0x8899aa,transparent:true,opacity:0.12});
  const g=new THREE.Group();
  for(let i=0;i<4;i++){const a=(i/4)*Math.PI*2;const pts=[new THREE.Vector3(0,0,0)];for(let r=0.2;r<=0.6;r+=0.2)pts.push(new THREE.Vector3(Math.cos(a)*r,Math.sin(a)*r*0.4,(Math.random()-0.5)*0.03));g.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts),wm));}
  g.position.copy(pos);g.position.y=0.02;g.scale.set(1,1,1);scene.add(g);
  webRemnants.push({mesh:g,life:3});
}

// ─── Three.js ────────────────────────────────────────
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0a0a1a);
scene.fog=new THREE.FogExp2(0x0a0a1a,0.022);

const camera=new THREE.PerspectiveCamera(38,innerWidth/innerHeight,0.1,50);
camera.position.set(10,15,20);camera.lookAt(10,0,10);

const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.2;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
composer.addPass(new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.3,0.15,0.08));
addEventListener('resize',()=>{const w=innerWidth,h=innerHeight;camera.aspect=w/h;camera.updateProjectionMatrix();renderer.setSize(w,h);composer.setSize(w,h);});

// ─── Sky gradient ────────────────────────────────────
const skyGeo=new THREE.SphereGeometry(25,32,32);
const skyVertices=skyGeo.attributes.position.array;
const colors=new Float32Array(skyVertices.length);
for(let i=0;i<skyVertices.length;i+=3){
  const y=skyVertices[i+1]/25;
  const t=THREE.MathUtils.clamp((y+1)/2,0,1);
  const c1=new THREE.Color(0x0a0a2a),c2=new THREE.Color(0x1a1a3a),c3=new THREE.Color(0x2a1a1a);
  const c=t<0.5?c1.clone().lerp(c2,t*2):c2.clone().lerp(c3,(t-0.5)*2);
  colors[i]=c.r;colors[i+1]=c.g;colors[i+2]=c.b;
}
skyGeo.setAttribute('color',new THREE.BufferAttribute(colors,3));
const sky=new THREE.Mesh(skyGeo,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide,depthWrite:false}));
scene.add(sky);

// ─── Textures ────────────────────────────────────────
function makeFurTex(){
  const c=document.createElement('canvas');c.width=128;c.height=128;
  const ctx=c.getContext('2d');
  for(let i=0;i<5000;i++){
    const x=Math.random()*128,y=Math.random()*128,a=Math.random()*Math.PI*2,l=1+Math.random()*5;
    ctx.strokeStyle=`rgba(${190+Math.random()*65},${140+Math.random()*50},${90+Math.random()*45},0.06+Math.random()*0.12)`;
    ctx.lineWidth=0.3+Math.random()*0.7;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+Math.cos(a)*l,y+Math.sin(a)*l);ctx.stroke();
  }
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}
const furTex=makeFurTex();

function makeGroundTex(bright=0){
  const c=document.createElement('canvas');c.width=128;c.height=128;
  const ctx=c.getContext('2d');const b=25+bright*30;
  // Base grass
  ctx.fillStyle=`rgb(${b-8},${b+8},${b-8})`;ctx.fillRect(0,0,128,128);
  for(let i=0;i<1200;i++){
    const x=Math.random()*128,y=Math.random()*128;
    ctx.strokeStyle=`rgba(${30+bright*40+Math.random()*40},${60+bright*50+Math.random()*50},${20+bright*30+Math.random()*30},0.15+Math.random()*0.35)`;
    ctx.lineWidth=0.4+Math.random()*0.8;ctx.beginPath();ctx.moveTo(x,y);
    ctx.lineTo(x+(Math.random()-0.5)*4,y-(2+Math.random()*7));ctx.stroke();
  }
  // Subtle checkerboard overlay
  ctx.globalCompositeOperation='overlay';const cw=16;
  for(let x=0;x<128;x+=cw)for(let y=0;y<128;y+=cw){const brightAdd=(x/cw%2===y/cw%2)?15:-8;ctx.fillStyle=`rgba(${brightAdd},${brightAdd},${brightAdd},0.12)`;ctx.fillRect(x,y,cw,cw);}
  // Radial gradient vignette on ground

  state.prevPos=[];state.targetPos=[];for(const s of state.snakeGrid){const p=g2v(s.x,s.y);state.prevPos.push(p.clone());state.targetPos.push(p.clone());}
  const sk=getSkinColor();

function updateParticles(dt){
  for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.mesh.position.add(p.vel.clone().multiplyScalar(dt*0.06));p.vel.y-=0.0003*dt;p.vel.x*=0.99;p.vel.z*=0.99;p.life-=dt*0.018;p.mesh.material.opacity=Math.max(0,p.life);p.mesh.scale.setScalar(0.2+p.life*0.8);if(p.spin)p.mesh.rotation.x+=p.spin;p.mesh.rotation.z+=0.02;if(p.life<=0){scene.remove(p.mesh);p.mesh.geometry.dispose();p.mesh.material.dispose();particles.splice(i,1);}}

function moveSnake(){
  const head=state.snakeGrid[0],nh={x:head.x+state.direction.x,y:head.y+state.direction.y};
  if(nh.x<0||nh.x>=COLS||nh.y<0||nh.y>=ROWS||state.snakeGrid.some(s=>s.x===nh.x&&s.y===nh.y)){
    if(state.activeBonuses.shield){state.activeBonuses.shield=false;state.bonuses.shield--;showStatus('🛡️ Щит сработал!');spawnParticles(g2v(Math.max(0,Math.min(nh.x,COLS-1)),Math.max(0,Math.min(nh.y,ROWS-1))),30);playSfx('shield');shake(6);return;}
    endGame();return;
  }
  state.snakeGrid.unshift(nh);let ate=false;
  if(nh.x===spiderPos.x&&nh.y===spiderPos.y){
    ate=true;const pts=state.activeBonuses['2x']?20:10;
    state.score+=pts;state.streak++;
    let coinsEarned=COINS_PER_SPIDER;
    let bonusNote='';
    if(state.streak%STREAK_BONUS_EVERY===0){coinsEarned+=STREAK_BONUS_COINS;bonusNote=` 🔥+${STREAK_BONUS_COINS}`;}
    if(state.score%MILESTONE_EVERY===0){coinsEarned+=MILESTONE_BONUS;bonusNote+=` 🏆+${MILESTONE_BONUS}`;spawnConfetti();playSfx('bonus');}
    state.coins+=coinsEarned;
    scoreEl.textContent=state.score;coinsEl.textContent=state.coins;popCoin();showFlash();
    playSfx('eat');comboEl.innerHTML=`+${pts}<small>🪙 +${coinsEarned}${bonusNote}</small>`;comboEl.classList.add('pop');
    streakEl.textContent=state.streak;streakBadge.classList.toggle('streak-hidden',state.streak<2);
    clearTimeout(comboTimeout);comboTimeout=setTimeout(()=>comboEl.classList.remove('pop'),700);
    spawnParticles(g2v(spiderPos.x,spiderPos.y),35,true);shake(4);spawnWebRemnant(g2v(spiderPos.x,spiderPos.y));
    showFloatingScore(`+${pts}`,pts>=20?'#ff44ff':'#ffd700');
    if(state.score%50===0&&state.moveInterval>MIN_INTERVAL){state.moveInterval=Math.max(MIN_INTERVAL,state.moveInterval-12);showStatus('⏩ Speed Up!');}updateSpeedBar();
    createSpider();save();
  }
  if(!ate)state.snakeGrid.pop();
  state.prevPos=state.targetPos.map(p=>p.clone());
  if(ate){
    const ci=Math.min(state.snakeGrid.length-1,BODY_COLORS.length-1);
    const col=bodyColor(getSkinColor(),ci);const mesh=createTail(col);const pos=g2v(state.snakeGrid[state.snakeGrid.length-1].x,state.snakeGrid[state.snakeGrid.length-1].y);
    mesh.position.copy(pos);mesh.position.y=0.05;scene.add(mesh);snakeSegments.push(mesh);state.targetPos.push(pos.clone());
    mesh.traverse(c=>{if(c.name==='tuft')tailTuft=c;});
  }
  for(let i=0;i<state.snakeGrid.length;i++)state.targetPos[i]=g2v(state.snakeGrid[i].x,state.snakeGrid[i].y);
  while(snakeSegments.length<state.snakeGrid.length){
    const idx=snakeSegments.length,ci=Math.min(idx,BODY_COLORS.length-1);
    const col=bodyColor(getSkinColor(),ci);const mesh=createBodySegment(col,Math.max(0.28,0.42-idx*0.008));mesh.add(createLegs(col,1));mesh.add(createLegs(col,-1));
    mesh.position.copy(state.targetPos[idx]);mesh.position.y=0.05;scene.add(mesh);snakeSegments.push(mesh);
  }
  while(snakeSegments.length>state.snakeGrid.length){const m=snakeSegments.pop();scene.remove(m);}
  rebuildConnectors();state.moveTimer=0;
}
function endGame(){
  state.gameOver=true;playSfx('die');shake(12);state.deathTimer=1200;
  flashEl.classList.remove('flash','death','show');void flashEl.offsetWidth;flashEl.classList.add('death','show');
  if(spiderMesh){spawnParticles(spiderMesh.position,50,true);spawnWebRemnant(spiderMesh.position);}
  if(snakeSegments.length>0)spawnParticles(snakeSegments[0].position,60,true);
  let extra='';
  if(state.score>state.highScore){state.highScore=state.score;const bonus=Math.floor(state.score/2);state.coins+=bonus;extra=` 🏆+${bonus}`;showStatus(`🎉 Новый рекорд! +${bonus}🪙`);}
  setTimeout(()=>{
    overlay.classList.add('show');overlayTitle.textContent='💀 Game Over';overlaySub.textContent='Ласка разбилась';
    overlayScore.innerHTML=`<span style="display:flex;justify-content:center;gap:16px">🏆 ${state.score} 🪙 ${state.coins}<br><small style="color:var(--gold);font-size:14px">Рекорд: ${state.highScore}</small></span>`;save();
    flashEl.classList.remove('death','show');
  },800);
}
function restart(){
  state.gameOver=false;state.score=0;state.streak=0;state.moveInterval=BASE_INTERVAL;
  state.direction={x:1,y:0};state.nextDirection={x:1,y:0};scoreEl.textContent='0';state.moveTimer=0;
  state.activeBonuses={};state._magnetCooldown=0;overlay.classList.remove('show');
  jawMesh=null;earMeshes=[];pupilMeshes=[];eyeWhiteMeshes=[];tailTuft=null;
  state.deathTimer=0;flashEl.classList.remove('flash','death','show');
  for(const p of particles){scene.remove(p.mesh);p.mesh.geometry.dispose();p.mesh.material.dispose();}
  for(const p of trailParticles){scene.remove(p.mesh);p.mesh.geometry.dispose();p.mesh.material.dispose();}
  for(const w of webRemnants){scene.remove(w.mesh);}webRemnants.length=0;
  particles.length=0;trailParticles.length=0;
  for(const s of snakeSegments)scene.remove(s);for(const c of bodyConnectors){scene.remove(c);c.geometry.dispose();c.material.dispose();}
  if(hatMesh){scene.remove(hatMesh);hatMesh=null;}
  bodyConnectors.length=0;snakeSegments.length=0;
  if(spiderMesh){scene.remove(spiderMesh);spiderMesh=null;}
  createWeasel();createSpider();updateBonusBar();updateSpeedBar();showStatus('🔄 Новая игра!');
}
function showStatus(msg){statusEl.textContent=msg;statusEl.classList.add('show');clearTimeout(statusEl._timeout);statusEl._timeout=setTimeout(()=>statusEl.classList.remove('show'),1500);}
function updateSpeedBar(){const p=1-(state.moveInterval-MIN_INTERVAL)/(BASE_INTERVAL-MIN_INTERVAL);speedFill.style.width=Math.min(100,Math.round(p*100))+'%';}

function updateBonusBar(){
  bonusBar.innerHTML='';const ab=state.activeBonuses;
  for(const[id,cfg]of Object.entries({shield:{icon:'🛡️'},'2x':{icon:'×2'},slow:{icon:'🐌'},magnet:{icon:'🧲'}})){
    if(ab[id]){const el=document.createElement('div');el.className='bonus-chip show';el.innerHTML=`${cfg.icon} <span class="timer">${id==='shield'?'✓':Math.ceil(ab[id])+'с'}</span>`;bonusBar.appendChild(el);}
  }
}
function activateBonus(id){
  switch(id){
    case 'shield':if(state.bonuses.shield>0){if(state.activeBonuses.shield){showStatus('🛡️ Щит уже активен');return;}state.activeBonuses.shield=true;showStatus('🛡️ Щит активирован!');playSfx('shield');}break;
    case '2x':if(state.bonuses['2x']>0){state.activeBonuses['2x']=20;state.bonuses['2x']--;showStatus('×2 Очки!');playSfx('bonus');}break;
    case 'slow':if(state.bonuses.slow>0){state.activeBonuses.slow=15;state.moveInterval=Math.max(MIN_INTERVAL,Math.floor(BASE_INTERVAL*1.5));state.bonuses.slow--;showStatus('🐌 Замедление!');playSfx('bonus');}break;
    case 'magnet':if(state.bonuses.magnet>0){state.activeBonuses.magnet=15;state.bonuses.magnet--;showStatus('🧲 Магнит!');playSfx('bonus');}break;
  }
  updateBonusBar();save();
}

// ─── Shop ────────────────────────────────────────────
let shopCategory='skins';
function openShop(){shopEl.classList.add('open');shopCoinsEl.textContent=state.coins;renderShop();}
function closeShop(){shopEl.classList.remove('open');if(!state.gameOver)state.paused=false;}
function renderShop(){
  shopCatsEl.innerHTML='';
  for(const[id,cat]of Object.entries(SHOP)){const b=document.createElement('button');b.textContent=cat.name;if(id===shopCategory)b.classList.add('active');b.addEventListener('click',()=>{shopCategory=id;renderShop();});shopCatsEl.appendChild(b);}
  const cat=SHOP[shopCategory];shopItemsEl.innerHTML='';
  if(!cat||!cat.items.length){shopItemsEl.innerHTML='<div class="empty">Пусто</div>';return;}
  for(const item of cat.items){
    const div=document.createElement('div');div.className='item';const isBonus=shopCategory==='bonuses';
    if(isBonus){
      const owned=state.bonuses[item.id]>0,ok=state.coins>=item.price;
      div.classList.toggle('owned',owned);
      div.innerHTML=`<div class="icon">${item.icon||'📦'}</div><div class="name">${item.name}</div><div class="desc">${item.desc||''}</div><div class="price">${owned?'✅':ok?'<span class="coin">🪙 '+item.price+'</span>':'<span class="locked">🔒</span>'}</div><div class="tag ${owned?'owned':ok?'buy':'locked'}">${owned?'В инвентаре':ok?'Купить':'Нет монет'}</div>`;
      if(ok||owned)div.addEventListener('click',()=>{
        if(!owned&&state.coins>=item.price){state.coins-=item.price;state.bonuses[item.id]=(state.bonuses[item.id]||0)+1;coinsEl.textContent=state.coins;popCoin();playSfx('buy');save();}
        activateBonus(item.id);renderShop();shopCoinsEl.textContent=state.coins;
      });
    }else{
      const owned=state.owned[shopCategory]?.includes(item.id);
      const eq=shopCategory==='skins'?state.skin===item.id:shopCategory==='hats'?state.hat===item.id:shopCategory==='trails'?state.trail===item.id:shopCategory==='scenes'?state.scene===item.id:false;
      const free=item.price===0,ok=state.coins>=item.price;
      div.classList.toggle('owned',owned);div.classList.toggle('equipped',eq);
      div.innerHTML=`<div class="icon">${item.icon||'📦'}</div><div class="name">${item.name}</div><div class="desc">${item.desc||''}</div><div class="price">${free?'<span class="free">Бесплатно</span>':owned?'🔄':ok?'<span class="coin">🪙 '+item.price+'</span>':'<span class="locked">🔒</span>'}</div><div class="tag ${eq?'equipped':owned?'owned':ok?'buy':'locked'}">${eq?'Надето':owned?'Выбрать':free?'Получить':'Нет монет'}</div>`;
      if(owned||free||ok)div.addEventListener('click',()=>{
        if(!owned&&state.coins>=item.price){state.coins-=item.price;coinsEl.textContent=state.coins;popCoin();if(!state.owned[shopCategory])state.owned[shopCategory]=[];state.owned[shopCategory].push(item.id);playSfx('buy');save();}
        if(owned||free||state.owned[shopCategory]?.includes(item.id)){
          if(shopCategory==='skins')state.skin=item.id;else if(shopCategory==='hats')state.hat=item.id;else if(shopCategory==='trails')state.trail=item.id;else if(shopCategory==='scenes')state.scene=item.id;
          save();
          if(shopCategory==='scenes')initEnvironment(state.scene);else applyCosmetics();
          renderShop();shopCoinsEl.textContent=state.coins;
        }
      });
    }
    shopItemsEl.appendChild(div);
  }
}
function applyCosmetics(){
  jawMesh=null;earMeshes=[];pupilMeshes=[];eyeWhiteMeshes=[];tailTuft=null;
  for(const s of snakeSegments)scene.remove(s);if(hatMesh){scene.remove(hatMesh);hatMesh=null;}
  for(const c of bodyConnectors){scene.remove(c);c.geometry.dispose();c.material.dispose();}
  bodyConnectors.length=0;snakeSegments.length=0;const sk=getSkinColor();
  for(let i=0;i<state.snakeGrid.length;i++){
    const ih=i===0,it=i===state.snakeGrid.length-1;const col=bodyColor(sk,i);const pos=state.targetPos[i].clone();
    let m;
    if(ih){m=createWeaselHead();m.position.copy(pos);m.position.y=0.08;m.traverse(c=>{if(c.name==='jaw')jawMesh=c;if(c.name==='ear')earMeshes.push(c);if(c.name==='pupil')pupilMeshes.push(c);if(c.name==='eyeWhite')eyeWhiteMeshes.push(c);});
      hatMesh=createHat(state.hat);hatMesh.position.copy(pos);hatMesh.position.y=0.08;hatMesh.traverse(c=>{if(c.isMesh)c.castShadow=true;});scene.add(hatMesh);
    }else if(it){m=createTail(col);m.position.copy(pos);m.position.y=0.05;m.traverse(c=>{if(c.name==='tuft')tailTuft=c;});}
    else{m=createBodySegment(col);m.position.copy(pos);m.position.y=0.05;m.add(createLegs(col,1));m.add(createLegs(col,-1));}
    scene.add(m);snakeSegments.push(m);
  }
  rebuildConnectors();
}

// ─── Input ───────────────────────────────────────────
document.addEventListener('keydown',e=>{
  if(e.key==='B'||e.key==='b'){if(shopEl.classList.contains('open'))closeShop();else{state.paused=true;openShop();}return;}
  if(e.key===' '||e.key==='Escape'){e.preventDefault();if(shopEl.classList.contains('open')){closeShop();return;}if(state.gameOver)return;state.paused=!state.paused;showStatus(state.paused?'⏸ Пауза':'▶ Продолжаем');return;}
  if(e.key==='Enter'||e.key==='r'||e.key==='R'){if(state.gameOver)restart();return;}
  if(state.paused||state.gameOver)return;
  switch(e.key){case 'ArrowUp':case 'w':case 'W':if(state.direction.y!==1)state.nextDirection={x:0,y:-1};break;case 'ArrowDown':case 's':case 'S':if(state.direction.y!==-1)state.nextDirection={x:0,y:1};break;case 'ArrowLeft':case 'a':case 'A':if(state.direction.x!==1)state.nextDirection={x:-1,y:0};break;case 'ArrowRight':case 'd':case 'D':if(state.direction.x!==-1)state.nextDirection={x:1,y:0};break;}
});
shopBtn.addEventListener('click',()=>{state.paused=true;openShop();});
shopClose.addEventListener('click',closeShop);
document.getElementById('restartBtn').addEventListener('click',restart);

let touchStart=null;
renderer.domElement.addEventListener('touchstart',e=>{touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});
renderer.domElement.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
renderer.domElement.addEventListener('touchend',e=>{
  if(!touchStart||state.paused||state.gameOver)return;
  const dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;
  if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
  if(Math.abs(dx)>Math.abs(dy)){if(dx>0&&state.direction.x!==-1)state.nextDirection={x:1,y:0};else if(dx<0&&state.direction.x!==1)state.nextDirection={x:-1,y:0};}
  else{if(dy>0&&state.direction.y!==-1)state.nextDirection={x:0,y:1};else if(dy<0&&state.direction.y!==1)state.nextDirection={x:0,y:-1};}
  touchStart=null;
},{passive:true});
let lastTap=0;
renderer.domElement.addEventListener('touchend',e=>{const now=Date.now();if(now-lastTap<300&&!state.gameOver){state.paused=!state.paused;showStatus(state.paused?'⏸ Пауза':'▶ Продолжаем');}lastTap=now;},{passive:true});

// ─── Animation loop ─────────────────────────────────
let lastTime=0,animFrame=null,comboTimeout=null;
function animate(time){
  animFrame=requestAnimationFrame(animate);
  const dt=lastTime?Math.min(time-lastTime,50):16;lastTime=time;const ab=state.activeBonuses;
  if(!state.paused&&!state.gameOver){
    if(ab['2x']){ab['2x']-=dt/1000;if(ab['2x']<=0){delete ab['2x'];showStatus('×2 закончился');if(!ab.slow)state.moveInterval=BASE_INTERVAL;}}
    if(ab.slow){ab.slow-=dt/1000;if(ab.slow<=0){delete ab.slow;state.moveInterval=BASE_INTERVAL;showStatus('🐌 Замедление кончилось');}}
    if(ab.magnet&&spiderMesh){
      if(!state._magnetCooldown||state._magnetCooldown<=0){const h=state.snakeGrid[0];const dx=h.x-spiderPos.x,dy=h.y-spiderPos.y;if(Math.abs(dx)+Math.abs(dy)>1){const mx=dx>0?1:dx<0?-1:0,my=dy>0?1:dy<0?-1:0;const nx=Math.max(0,Math.min(COLS-1,spiderPos.x+mx)),ny=Math.max(0,Math.min(ROWS-1,spiderPos.y+my));if(!state.snakeGrid.some(s=>s.x===nx&&s.y===ny)){spiderPos.x=nx;spiderPos.y=ny;}}state._magnetCooldown=300;}else state._magnetCooldown-=dt;
    }
    updateBonusBar();state.moveTimer+=dt;
    if(state.moveTimer>=state.moveInterval){state.direction={...state.nextDirection};moveSnake();}
  }
  const t=Math.min(state.moveTimer/state.moveInterval,1),st=t*t*(3-2*t);
  for(let i=0;i<snakeSegments.length&&i<state.prevPos.length&&i<state.targetPos.length;i++){
    const pos=new THREE.Vector3().lerpVectors(state.prevPos[i],state.targetPos[i],st);snakeSegments[i].position.copy(pos);snakeSegments[i].position.y=0.08-i*0.005;
    if(i===0){const d=new THREE.Vector3().subVectors(state.targetPos[0],state.prevPos[0]);if(d.length()>0.001){d.y=0;snakeSegments[0].rotation.y=Math.atan2(d.x,d.z);}snakeSegments[0].position.y+=Math.sin(time*0.006)*0.025;}
    if(i>0&&i<snakeSegments.length-1)snakeSegments[i].position.y+=Math.sin(time*0.004+i*0.7)*0.02;
  }
  for(let i=0;i<bodyConnectors.length&&i<snakeSegments.length-1;i++){
    const a=snakeSegments[i].position,b=snakeSegments[i+1].position;
    bodyConnectors[i].position.copy(a).add(b).multiplyScalar(0.5);bodyConnectors[i].position.y=0.05;
    const d=new THREE.Vector3().subVectors(a,b);if(d.length()>0.001){d.y=0;d.normalize();bodyConnectors[i].quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d);}
    bodyConnectors[i].scale.y=a.distanceTo(b)*0.85;
  }
  if(hatMesh&&snakeSegments.length>0){hatMesh.position.copy(snakeSegments[0].position);hatMesh.position.y+=0.08;hatMesh.rotation.copy(snakeSegments[0].rotation);}
  if(jawMesh)jawMesh.position.y=-0.24+Math.sin(time*0.003)*0.015;
  for(let i=0;i<earMeshes.length;i++){const s=i===0?1:-1;earMeshes[i].rotation.z=s*0.3+Math.sin(time*0.005+i)*0.03;earMeshes[i].rotation.x=-0.2+Math.sin(time*0.004+i*1.5)*0.02;}
  if(pupilMeshes.length>=2){const lx=Math.sin(time*0.002)*0.02,ly=Math.sin(time*0.0015)*0.01;pupilMeshes[0].position.x=-0.24+lx;pupilMeshes[1].position.x=0.24+lx;pupilMeshes[0].position.y=0.10+ly;pupilMeshes[1].position.y=0.10+ly;}
  // Idle head sway
  if(snakeSegments.length>0&&!state.gameOver){const sway=Math.sin(time*0.0015)*0.02;snakeSegments[0].position.x+=sway;snakeSegments[0].rotation.z=Math.sin(time*0.002)*0.02;}
  // Blink (squash eyes)
  if(!state._blinkTimer)state._blinkTimer=2000+Math.random()*3000;
  state._blinkTimer-=dt;
  if(state._blinkTimer<0){const bt=Math.sin(Math.max(0,Math.min(1,1+state._blinkTimer/100))*Math.PI);for(const el of eyeWhiteMeshes)el.scale.y=1.1-bt*0.9;for(const p of pupilMeshes)p.scale.y=1-bt*0.9;if(state._blinkTimer<-100){state._blinkTimer=2000+Math.random()*3000;for(const el of eyeWhiteMeshes)el.scale.y=1.1;for(const p of pupilMeshes)p.scale.y=1;}}
  if(tailTuft){tailTuft.material.emissiveIntensity=0.2+Math.sin(time*0.005)*0.25;}
  const tail=snakeSegments[snakeSegments.length-1];if(tail&&tail.name==='tail')tail.rotation.y=Math.sin(time*0.003)*0.15;
  for(let i=1;i<snakeSegments.length-1;i++){const seg=snakeSegments[i];if(seg.type==='Mesh'){seg.children.forEach(c=>{if(c.name==='legUpper'||c.name==='legLower')c.rotation.z+=Math.sin(time*0.006+i*0.5)*0.015;if(c.name==='foot')c.position.y=-0.16+Math.sin(time*0.006+i*0.5)*0.025;});}}
  if(spiderMesh){spiderMesh.position.copy(g2v(spiderPos.x,spiderPos.y));spiderMesh.position.y=0.15+Math.sin(time*0.004)*0.05;spiderMesh.rotation.y+=0.01;const dist=spiderMesh.position.distanceTo(snakeSegments.length>0?snakeSegments[0].position:spiderMesh.position);const danger=Math.max(0,1-dist/5);const legSpd=0.004+danger*0.012;for(const lm of spiderLegMeshes){const li=parseInt(lm.name.split('_')[1])||0,ph=li*0.8+time*legSpd,wc=Math.sin(ph)*0.12;if(lm.name.startsWith('femur_'))lm.rotation.x+=wc*0.02;else if(lm.name.startsWith('tibia_'))lm.rotation.x+=wc*0.03;}spiderMesh.traverse(c=>{if(c.isMesh&&c.material.emissiveIntensity!==undefined){c.material.emissiveIntensity=0.04+danger*0.3;c.material.emissive?.setHex(danger>0.4?0xff2244:0xdd4488);if(danger>0.5)c.material.emissiveIntensity=0.04+Math.sin(time*0.01)*0.3;}});}
  if(!state.paused&&!state.gameOver&&snakeSegments.length>0&&state.trail!=='none'&&time%3<1.5)spawnTrail(snakeSegments[0].position);
  // Web remnants fade
  for(let i=webRemnants.length-1;i>=0;i--){const w=webRemnants[i];w.life-=dt/1000;const s=Math.max(0,w.life/3);w.mesh.scale.setScalar(0.5+s*0.5);w.mesh.children.forEach(c=>{if(c.material)c.material.opacity=s*0.12;});if(w.life<=0){scene.remove(w.mesh);webRemnants.splice(i,1);}}
  dustP.rotation.y+=0.0003;dustMat.opacity=0.12+Math.sin(time*0.0008)*0.08;updateParticles(dt);
  // Death animation (slow zoom + red flash)
  if(state.deathTimer>0&&snakeSegments.length>0){state.deathTimer-=dt;const p=Math.max(0,state.deathTimer/1200);const h2=snakeSegments[0].position;const tdc=new THREE.Vector3(h2.x+3*p+1,2.5+5*(1-p),h2.z+3*p+2);camera.position.lerp(tdc,0.04);camera.lookAt(new THREE.Vector3(h2.x,0.2,h2.z));}
  else if(!state.gameOver&&snakeSegments.length>0){
    const h=snakeSegments[0].position;const len=Math.min(snakeSegments.length,20);const zoom=Math.max(7,13-len*0.15);
    const lookDir=state.direction;const la=0.6+len*0.02;
    const tc=new THREE.Vector3(h.x+(8-len*0.08)+lookDir.x*la,zoom+Math.sin(time*0.002)*0.3,h.z+(14-len*0.1)+lookDir.y*la);
    camera.position.lerp(tc,0.02);
    const laTarget=new THREE.Vector3(h.x+lookDir.x*2,0.3,h.z+lookDir.y*2);camera.lookAt(laTarget);
  }
  // Animated env (sway trees/decor)
  for(const o of envObjects){if(o.userData&&o.userData.sway){o.rotation.z=Math.sin(time*0.002+o.userData.phase)*o.userData.swayAmt;o.rotation.x=Math.sin(time*0.0015+o.userData.phase*1.3)*o.userData.swayAmt*0.5;}}
  // Ground tile pulse near weasel
  if(snakeSegments.length>0){const hp=snakeSegments[0].position;for(const t of groundTiles){const d=hp.distanceTo(new THREE.Vector3(t.userData.gx,0,t.userData.gz));const g=d<3?0.2+Math.sin(time*0.003+d*2)*0.3*Math.max(0,1-d/3):0;t.material.opacity=g;}}
  // Screen shake
  if(screenShake>0){const sx=(Math.random()-0.5)*screenShake*0.04,sy=(Math.random()-0.5)*screenShake*0.04;camera.position.x+=sx;camera.position.y+=sy;screenShake*=0.88;if(screenShake<0.05)screenShake=0;}
  composer.render();
}

// ─── Init ────────────────────────────────────────────
initEnvironment(state.scene);createWeasel();createSpider();
coinsEl.textContent=state.coins;scoreEl.textContent=state.score;updateSpeedBar();
animFrame=requestAnimationFrame(animate);

overlay.classList.add('show');
overlayTitle.textContent='🦊 Ласка vs 🕷️';
overlaySub.textContent=state.highScore>0?`🏆 Рекорд: ${state.highScore} · Гоняй пауков 🪙`:'Гоняй пауков, зарабатывай 🪙 и покупай крутые штуки!';
const sb=document.createElement('button');sb.className='btn-start';sb.textContent='🎮 Играть!';
sb.addEventListener('click',e=>{e.stopPropagation();if(state.gameOver)restart();else{state.paused=false;overlay.classList.remove('show');if(audioCtx.state==='suspended')audioCtx.resume();}});
document.querySelector('#overlay .card').appendChild(sb);
overlay.addEventListener('click',()=>{if(state.gameOver&&overlayTitle.textContent.includes('Game Over'))restart();});

console.log('🦊 Ласка vs Паук — профессиональный ремастер');
console.log('⬆⬇⬅➡ / WASD · Пробел — пауза · B — магазин');
